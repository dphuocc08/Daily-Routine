<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Bootstrap Đầu Tiên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-primary text-center">Chào mừng bạn đến với Bootstrap!</h1>
        <p class="lead text-center">Đây là một ví dụ đơn giản về cách nhúng và sử dụng các class của Bootstrap.</p>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-3 shadow">
                    <h3>Cột bên trái</h3>
                    <p>Nội dung này tự động co giãn trên thiết bị di động.</p>
                    <button class="btn btn-success">Nút màu xanh</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 shadow">
                    <h3>Cột bên phải</h3>
                    <p>Sử dụng hệ thống Grid (12 cột) của Bootstrap.</p>
                    <button class="btn btn-danger">Nút màu đỏ</button>
                </div>
            </div>
        </div>
    </div>
    <button class="btn btn-primary">Nút Primary đã đổi màu</button>
<button class="btn btn-custom shadow">Nút Custom hoàn toàn</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    /* Cách 1: Ghi đè trực tiếp class của Bootstrap */
    .btn-primary {
        background-color: #6a1b9a !important; /* Màu tím đậm */
        border-color: #4a148c !important;
        border-radius: 20px; /* Bo góc tròn hơn */
    }

    /* Cách 2: Tạo một class tùy chỉnh riêng (Khuyên dùng) */
    .btn-custom {
        background-color: #ff5722;
        color: white;
        padding: 10px 30px;
        transition: 0.3s;
    }
    .btn-custom:hover {
        background-color: #e64a19;
        transform: scale(1.05); /* Hiệu ứng phóng to nhẹ khi di chuột */
    }
</style>
</body>
</html>
